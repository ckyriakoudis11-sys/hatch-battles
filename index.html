<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hatch Battles</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; overflow-x: hidden; padding-bottom: 40px;
  }
  h1 {
    font-size: 2.4rem; font-weight: 700; margin-top: 20px;
    background: linear-gradient(135deg, #ffd700, #ff6b6b, #ee5a24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #8888aa; font-size: 0.95rem; margin-bottom: 15px; font-family: 'Inter', sans-serif; }
  .dual-container { display: flex; gap: 10px; justify-content: center; align-items: flex-start; padding: 0 10px; max-width: 1400px; flex-wrap: nowrap; }
  .team-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 520px; }
  .team-label {
    width: 100%; text-align: center; font-size: 0.8rem; color: #888;
    font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px;
    padding-bottom: 4px;
  }
  .team-label.t1 { color: #48cae4; }
  .team-label.t2 { color: #ff6b6b; }
  .vs-divider {
    display: flex; align-items: center; font-size: 1.5rem; font-weight: 800;
    color: #ff6b6b; text-shadow: 0 0 15px rgba(255,107,107,0.4);
    padding: 0 5px;
  }
  .randomise-all {
    padding: 10px 28px; border-radius: 30px;
    border: 2px solid rgba(255,255,255,0.12); background: transparent;
    color: #888; font-family: 'Fredoka', sans-serif; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px;
  }
  .randomise-all:hover { border-color: #ffd700; color: #ffd700; }
  .egg-panel {
    background: rgba(255,255,255,0.04); backdrop-filter: blur(10px);
    border-radius: 20px; padding: 16px; width: 245px;
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .panel-header { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
  .panel-title { font-size: 1.1rem; color: #ffd700; font-weight: 600; }
  .rand-btn {
    padding: 5px 14px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.12);
    background: transparent; color: #888; font-family: 'Fredoka', sans-serif;
    font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .rand-btn:hover { border-color: #4cc9f0; color: #4cc9f0; }
  .egg-holder { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .egg-container { position: relative; width: 160px; height: 200px; display: flex; align-items: center; justify-content: center; }
  .egg {
    position: relative;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transition: width 0.3s, height 0.3s, background 0.3s;
    overflow: hidden;
  }
  .egg .shine {
    position: absolute; width: 28%; height: 16%; background: rgba(255,255,255,0.2);
    border-radius: 50%; top: 13%; left: 16%; transform: rotate(-30deg); pointer-events: none; z-index: 3;
  }
  .egg .accent-band {
    position: absolute; width: 100%; height: 20%; bottom: 28%; left: 0;
    overflow: hidden; opacity: 0.55; pointer-events: none;
  }
  .egg .spots { position: absolute; width: 100%; height: 100%; pointer-events: none; }
  .egg .spot { position: absolute; border-radius: 50%; opacity: 0.3; }
  .crack-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.3s;
  }
  .egg.wobbling { animation: wobble 0.12s ease-in-out infinite alternate; }
  @keyframes wobble { 0% { transform: rotate(-5deg) translateX(-2px); } 100% { transform: rotate(5deg) translateX(2px); } }
  .nest {
    width: 90px; height: 20px;
    background: radial-gradient(ellipse, #8B6914, #6B4E12);
    border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .controls-grid { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .control-group label {
    display: block; font-size: 0.72rem; color: #aaa; margin-bottom: 6px;
    font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px;
  }
  .option-row { display: flex; gap: 6px; }
  .opt-btn {
    flex: 1; padding: 9px 4px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    color: #999; font-family: 'Fredoka', sans-serif; font-size: 0.82rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .opt-btn:hover { border-color: rgba(255,215,0,0.4); color: #ddd; }
  .opt-btn.selected { background: #ffd700; border-color: #ffd700; color: #1a1a2e; }
  .limb-btn {
    flex: 1; padding: 7px 2px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    color: #999; font-family: 'Fredoka', sans-serif; font-size: 0.75rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; line-height: 1.2;
  }
  .limb-btn:hover { border-color: rgba(255,215,0,0.4); color: #ddd; }
  .limb-btn.selected { background: #ffd700; border-color: #ffd700; color: #1a1a2e; }
  .limb-btn .ln { font-size: 1rem; display: block; }
  .limb-btn .ld { font-size: 0.55rem; opacity: 0.7; }


  .hatch-btn {
    padding: 16px 60px; border-radius: 50px; border: none;
    background: linear-gradient(135deg, #ffd700, #ff6b6b);
    color: #1a1a2e; font-family: 'Fredoka', sans-serif;
    font-size: 1.4rem; font-weight: 700; cursor: pointer;
    transition: all 0.3s; box-shadow: 0 5px 30px rgba(255,215,0,0.3);
    letter-spacing: 1px; margin-top: 15px;
  }
  .hatch-btn:hover { transform: scale(1.05); box-shadow: 0 5px 40px rgba(255,215,0,0.5); }
  .hatch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .results-row { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .result-card {
    display: none; flex-direction: column; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(10px);
    border-radius: 22px; padding: 25px 30px;
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center; animation: fadeUp 0.6s ease-out; width: 240px;
  }
  .result-card.visible { display: flex; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .result-animal-svg {
    width: 180px; height: 180px;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .result-animal-svg svg { width: 100%; height: 100%; }
  @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .result-name {
    font-size: 2rem; font-weight: 700;
    background: linear-gradient(135deg, #ffd700, #ff6b6b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .result-stats {
    width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
  }
  .stat-row {
    display: flex; align-items: center; gap: 8px;
  }
  .stat-label {
    font-family: 'Inter', sans-serif; font-size: 0.7rem; color: #888;
    text-transform: uppercase; letter-spacing: 0.5px; width: 70px; text-align: right; flex-shrink: 0;
  }
  .stat-bar-bg {
    flex: 1; height: 14px; background: rgba(255,255,255,0.08); border-radius: 7px; overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%; border-radius: 7px; transition: width 0.6s ease-out;
  }
  .stat-value {
    font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600;
    color: #ddd; width: 42px; flex-shrink: 0;
  }
  .stat-count {
    text-align: center; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #aaa; margin-top: 2px;
  }
  .stat-count span { color: #ffd700; font-weight: 700; font-size: 1.1rem; }
  .try-again-btn, .battle-btn-bottom {
    padding: 12px 40px; border-radius: 30px;
    border: 2px solid rgba(255,255,255,0.15); background: transparent;
    color: #ccc; font-family: 'Fredoka', sans-serif; font-size: 1.05rem;
    cursor: pointer; transition: all 0.2s; margin-top: 15px;
  }
  .try-again-btn:hover { border-color: #ffd700; color: #ffd700; }
  .battle-btn-bottom {
    background: linear-gradient(135deg, #e74c3c, #c0392b); border: none;
    color: #fff; font-size: 1.3rem; font-weight: 700; letter-spacing: 1px;
    padding: 14px 50px; box-shadow: 0 5px 25px rgba(231,76,60,0.4);
  }
  .battle-btn-bottom:hover { transform: scale(1.05); box-shadow: 0 5px 35px rgba(231,76,60,0.6); }

  /* Battle Arena */
  .battle-arena {
    display: none; flex-direction: column; align-items: center; gap: 12px;
    width: 100%; max-width: 850px; padding: 20px;
  }
  .battle-arena.visible { display: flex; }
  .arena-header {
    font-size: 1.4rem; font-weight: 700; color: #ff6b6b;
    font-family: 'Fredoka', sans-serif; letter-spacing: 1px;
  }
  .battle-stage {
    position: relative; width: 100%; height: 400px;
    background: linear-gradient(180deg, rgba(15,12,41,0.8), rgba(30,30,60,0.6));
    border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .stage-ground {
    position: absolute; bottom: 0; width: 100%; height: 60px;
    background: linear-gradient(180deg, rgba(40,60,30,0.4), rgba(30,50,20,0.6));
    border-radius: 0 0 16px 16px;
  }
  .stage-unit {
    position: absolute; display: flex; flex-direction: column; align-items: center;
    transition: opacity 0.5s;
  }
  .stage-unit.dead { opacity: 0.15; }
  .stage-unit-svg { width: 50px; height: 50px; }
  .stage-unit-svg svg { width: 100%; height: 100%; }
  .stage-unit-svg.flipped svg { transform: scaleX(-1); }
  .stage-hp {
    width: 46px; height: 5px; background: rgba(0,0,0,0.5);
    border-radius: 3px; overflow: hidden; margin-top: 2px;
  }
  .stage-hp-fill {
    height: 100%; border-radius: 3px;
    background: #2ecc71; transition: width 0.15s;
  }
  .stage-name {
    font-family: 'Inter', sans-serif; font-size: 0.5rem; color: rgba(255,255,255,0.6);
    white-space: nowrap; margin-top: 1px;
  }
  .stage-dmg-popup {
    position: absolute; font-family: 'Inter', sans-serif;
    font-weight: 800; font-size: 0.75rem; pointer-events: none;
    animation: stageDmgFloat 0.8s ease-out forwards; z-index: 20;
  }
  @keyframes stageDmgFloat {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-25px) scale(0.8); }
  }
  .stage-dmg-popup.crit-pop { color: #ffd700; font-size: 1rem; }
  .stage-dmg-popup.strong-pop { color: #e67e22; }
  .stage-dmg-popup.weak-pop { color: #888; }
  .stage-dmg-popup.miss-pop { color: #555; }
  .stage-dmg-popup.normal-pop { color: #ccc; }
  .arena-winner {
    font-size: 2rem; font-weight: 700;
    background: linear-gradient(135deg, #ffd700, #ff6b6b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: fadeUp 0.5s ease-out;
  }
  .arena-controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .speed-btn {
    padding: 5px 14px; border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.12); background: transparent;
    color: #888; font-family: 'Fredoka', sans-serif; font-size: 0.8rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .speed-btn:hover { border-color: #48cae4; color: #48cae4; }
  .speed-btn.active { background: #48cae4; border-color: #48cae4; color: #1a1a2e; }
  .rematch-btn {
    padding: 5px 16px; border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.12); background: transparent;
    color: #888; font-family: 'Fredoka', sans-serif; font-size: 0.8rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .rematch-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }
  /* Matchup chart */
  .mult-toggle {
    position: fixed; bottom: 20px; left: 20px; z-index: 50;
    padding: 10px 18px; border-radius: 30px;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    color: #aaa; font-family: 'Fredoka', sans-serif; font-size: 0.8rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .mult-toggle:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .mult-toggle.on { border-color: #ffd700; color: #ffd700; }
  .matchup-toggle {
    position: fixed; bottom: 20px; right: 20px; z-index: 50;
    padding: 10px 18px; border-radius: 30px;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    color: #aaa; font-family: 'Fredoka', sans-serif; font-size: 0.8rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .matchup-toggle:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .matchup-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center;
    padding: 20px;
  }
  .matchup-overlay.visible { display: flex; }
  .matchup-panel {
    background: #1a1a2e; border-radius: 16px; padding: 24px;
    max-width: 95vw; max-height: 90vh; overflow: auto;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .matchup-title {
    font-size: 1.3rem; font-weight: 700; color: #ffd700; margin-bottom: 4px;
  }
  .matchup-subtitle {
    font-size: 0.75rem; color: #666; font-family: 'Inter', sans-serif; margin-bottom: 14px;
  }
  .matchup-close {
    float: right; background: none; border: none; color: #888; font-size: 1.5rem;
    cursor: pointer; padding: 0 6px; line-height: 1;
  }
  .matchup-close:hover { color: #fff; }
  .matchup-table {
    border-collapse: collapse; font-family: 'Inter', sans-serif; font-size: 0.7rem;
    width: 100%;
  }
  .matchup-table th {
    padding: 6px 8px; color: #aaa; font-weight: 600; text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    white-space: nowrap;
  }
  .matchup-table th.corner { background: transparent; }
  .matchup-table th.col-header {
    writing-mode: horizontal-tb; font-size: 0.65rem;
  }
  .matchup-table td {
    padding: 5px 6px; text-align: center; border: 1px solid rgba(255,255,255,0.05);
    font-weight: 600; font-size: 0.7rem; white-space: nowrap;
  }
  .matchup-table .row-header {
    text-align: right; color: #aaa; font-weight: 600; padding-right: 10px;
    border: none;
  }
  .matchup-table .win1 { background: rgba(72,202,228,0.15); color: #48cae4; }
  .matchup-table .win2 { background: rgba(255,107,107,0.15); color: #ff6b6b; }
  .matchup-table .draw { background: rgba(255,215,0,0.1); color: #ffd700; }
  .matchup-table .mirror { background: rgba(255,255,255,0.03); color: #666; }
  .matchup-legend {
    display: flex; gap: 16px; margin-top: 10px; font-size: 0.7rem;
    font-family: 'Inter', sans-serif; color: #888;
  }
  .matchup-legend span { font-weight: 600; }
  .legend-t1 { color: #48cae4; }
  .legend-t2 { color: #ff6b6b; }

  .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
  .particle { position: absolute; border-radius: 50%; animation: particleFly 1s ease-out forwards; }
  @keyframes particleFly { 0% { opacity:1; transform: translate(0,0) scale(1); } 100% { opacity:0; transform: translate(var(--dx),var(--dy)) scale(0); } }
  .shell-fragment { position: absolute; border-radius: 30% 70% 50% 50%; animation: shellFly 0.8s ease-out forwards; }
  @keyframes shellFly { 0% { opacity:1; transform: translate(0,0) rotate(0deg); } 100% { opacity:0; transform: translate(var(--dx),var(--dy)) rotate(var(--rot)); } }
  @media (max-width: 1100px) {
    .dual-container { flex-wrap: wrap; }
  }
  @media (max-width: 800px) {
    h1 { font-size: 1.7rem; }
    .egg-panel { width: 95vw; }
    .dual-container { gap: 10px; }
  }
</style>
</head>
<body>
<h1>Hatch Battles</h1>
<p class="subtitle">Craft four eggs. Two vs two.</p>
<div class="dual-container" id="dualContainer"></div>
<button class="randomise-all" id="randomiseAll">Randomise All</button>
<button class="hatch-btn" id="hatchBtn">Hatch All!</button>
<div class="results-row" id="resultsRow">
  <div class="result-card" id="result0">
    <div class="result-animal-svg" id="resultSvg0"></div>
    <div class="result-name" id="resultName0"></div>
    <div class="result-stats" id="resultStats0"></div>
  </div>
  <div class="result-card" id="result1">
    <div class="result-animal-svg" id="resultSvg1"></div>
    <div class="result-name" id="resultName1"></div>
    <div class="result-stats" id="resultStats1"></div>
  </div>
  <div class="result-card" id="result2">
    <div class="result-animal-svg" id="resultSvg2"></div>
    <div class="result-name" id="resultName2"></div>
    <div class="result-stats" id="resultStats2"></div>
  </div>
  <div class="result-card" id="result3">
    <div class="result-animal-svg" id="resultSvg3"></div>
    <div class="result-name" id="resultName3"></div>
    <div class="result-stats" id="resultStats3"></div>
  </div>
</div>
<button class="battle-btn-bottom" id="battleBtn" style="display:none;">Battle!</button>
<div class="battle-arena" id="battleArena">
  <div class="arena-header" id="arenaHeader">Battle!</div>
  <div class="arena-controls" id="arenaControls">
    <button class="speed-btn active" data-speed="1">1x</button>
    <button class="speed-btn" data-speed="2">2x</button>
    <button class="speed-btn" data-speed="4">4x</button>
    <button class="rematch-btn" id="rematchBtn">Rematch</button>
  </div>
  <div class="battle-stage" id="battleStage">
    <div class="stage-ground"></div>
  </div>
  <div class="arena-winner" id="arenaWinner" style="display:none;"></div>
</div>
<button class="try-again-btn" id="tryAgainBtn" style="display:none;">Make New Eggs</button>
<button class="mult-toggle on" id="multToggle">RNG: ON</button>
<button class="matchup-toggle" id="matchupToggle">Matchup Chart</button>
<div class="matchup-overlay" id="matchupOverlay">
  <div class="matchup-panel">
    <button class="matchup-close" id="matchupClose">&times;</button>
    <div class="matchup-title">Matchup Chart</div>
    <div class="matchup-subtitle">All 81 battles simulated with base damage (no RNG). Row = Team 1, Column = Team 2.</div>
    <div id="matchupTableContainer"></div>
    <div class="matchup-legend">
      <div><span class="legend-t1">Blue</span> = Row wins</div>
      <div><span class="legend-t2">Red</span> = Column wins</div>
      <div>Shows: survivors remaining / battle time</div>
    </div>
  </div>
</div>
<div class="particles" id="particles"></div>

<script>
// ===== ANIMALS (with realistic colours) =====
const ANIMALS = {
  "0-0-0": { name: "Slug",           m: '#8B7D6B', a: '#C4B7A6' },
  "0-0-1": { name: "Hummingbird",    m: '#2EAD65', a: '#E74C3C' },
  "0-0-2": { name: "Sugar Glider",   m: '#9E9E9E', a: '#F5E6CA' },
  "0-0-3": { name: "Butterfly",      m: '#E67E22', a: '#222222' },
  "0-1-0": { name: "Clownfish",      m: '#FF6B00', a: '#FFFFFF' },
  "0-1-1": { name: "Robin",          m: '#7B6249', a: '#E25822' },
  "0-1-2": { name: "Cat",            m: '#D4853B', a: '#F5E0C3' },
  "0-1-3": { name: "Ant",            m: '#5C2018', a: '#8B4513' },
  "0-2-0": { name: "Seahorse",       m: '#D4A017', a: '#E8C547' },
  "0-2-1": { name: "Penguin",        m: '#1C1C1C', a: '#F5F5F5' },
  "0-2-2": { name: "Hedgehog",       m: '#8B6C4A', a: '#C4A87C' },
  "0-2-3": { name: "Beetle",         m: '#1A5C1A', a: '#0E380E' },
  "1-0-0": { name: "Flying Fish",    m: '#7B9DB7', a: '#B8D4E3' },
  "1-0-1": { name: "Falcon",         m: '#5D6D7E', a: '#F5E6CA' },
  "1-0-2": { name: "Deer",           m: '#A0785A', a: '#F5E6CA' },

const CAT_NAMES = ['Muffin','Poppy','Jesse','Amberleigh','Haglar','Jasper'];
const HUMAN_NAMES = ['Jasper','Crispin','Blythe'];

function generateName(animalName, unitIndex) {
  // Cats get their own fixed names, one each
  if (animalName === 'Cat') {
    return CAT_NAMES[unitIndex % CAT_NAMES.length];
  }
  // Humans get their own fixed names
  if (animalName === 'Human') {
    return HUMAN_NAMES[unitIndex % HUMAN_NAMES.length];
  }

  const name = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)];

  // Check for special overrides
  if (NAME_OVERRIDES[name]) {
    return `${NAME_OVERRIDES[name]} ${name}`;
  }

  // Try alliteration: match adjective starting letter to name's first letter
  const letter = name.charAt(0).toUpperCase();
  const allitAdjs = ALLIT[letter];
  if (allitAdjs && allitAdjs.length > 0) {
    const adj = allitAdjs[Math.floor(Math.random() * allitAdjs.length)];
    return `${adj.charAt(0).toUpperCase() + adj.slice(1)} ${name}`;
  }

  // Fallback: use animal-specific adjective
  const adjs = ANIMAL_ADJECTIVES[animalName] || ['wild','brave','bold','fierce'];
  const adj = adjs[Math.floor(Math.random() * adjs.length)];
  return `${adj.charAt(0).toUpperCase() + adj.slice(1)} ${name}`;
}

function wireButtons(rowId, cls, setter) {
  const row = document.getElementById(rowId);
  row.querySelectorAll(`.${cls}`).forEach(btn => {
    btn.addEventListener('click', () => {
      row.querySelectorAll(`.${cls}`).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      setter(parseInt(btn.dataset.val));
    });
  });
}

function randomise(idx) {
  panels[idx].size = Math.floor(Math.random() * 3);
  panels[idx].density = Math.floor(Math.random() * 3);
  panels[idx].limbs = Math.floor(Math.random() * 4);

  // Update buttons visually
  [`size${idx}`, `dens${idx}`].forEach(rowId => {
    const row = document.getElementById(rowId);
    row.querySelectorAll('.opt-btn').forEach(b => {
      b.classList.toggle('selected', parseInt(b.dataset.val) === panels[idx][rowId.startsWith('size') ? 'size' : 'density']);
    });
  });
  const limbRow = document.getElementById(`limb${idx}`);
  limbRow.querySelectorAll('.limb-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.val) === panels[idx].limbs);
  });
  updateEgg(idx);
}

// ===== EGG RENDERING =====
function updateEgg(idx) {
  const s = panels[idx];
  const egg = document.getElementById(`egg${idx}`);
  const key = `${s.size}-${s.density}-${s.limbs}`;
  const animal = ANIMALS[key];
  const mc = animal.m;
  const ac = animal.a;
  const sizes = [[80,105],[110,142],[145,188]];
  const [w, h] = sizes[s.size];
  egg.style.width = w + 'px';
  egg.style.height = h + 'px';
  egg.style.background = mc;

  const d = s.density;
  egg.style.boxShadow = `
    inset -${8+d*5}px -${4+d*4}px ${12+d*6}px rgba(0,0,0,${0.15+d*0.1}),
    inset 8px 8px 20px rgba(255,255,255,${0.18-d*0.04}),
    0 ${8+d*5}px ${25+d*12}px rgba(0,0,0,${0.2+d*0.08})
  `;

  document.getElementById(`band${idx}`).innerHTML = `<div style="position:absolute;width:140%;height:100%;left:-20%;top:0;background:${ac};border-radius:50%;"></div>`;

  const spots = document.getElementById(`spots${idx}`);
  spots.innerHTML = '';
  const count = [2,4,6,8][s.limbs];
  for (let i = 0; i < count; i++) {
    const sp = document.createElement('div');
    sp.className = 'spot';
    const sz = 5 + Math.random() * 9;
    sp.style.cssText = `width:${sz}px;height:${sz}px;background:${ac};left:${15+Math.random()*65}%;top:${10+Math.random()*70}%`;
    spots.appendChild(sp);
  }
}

// ===== CRACKS =====
function generateCracks(svgEl) {
  svgEl.innerHTML = '';
  const numCracks = 5 + Math.floor(Math.random() * 3);
  for (let c = 0; c < numCracks; c++) {
    let x = 35 + Math.random() * 30;
    let y = 25 + Math.random() * 40;
    let pts = `${x},${y}`;
    const segments = 6 + Math.floor(Math.random() * 6);
    const angle = Math.random() * Math.PI * 2;
    for (let i = 0; i < segments; i++) {
      x += Math.cos(angle + (Math.random()-0.5)*2.5) * (3 + Math.random()*7);
      y += Math.sin(angle + (Math.random()-0.5)*2.5) * (3 + Math.random()*7);
      x = Math.max(5, Math.min(95, x));
      y = Math.max(5, Math.min(95, y));
      pts += ` ${x},${y}`;
    }
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', pts);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', 'rgba(30,20,10,0.8)');
    line.setAttribute('stroke-width', (1 + Math.random()).toFixed(1));
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-linejoin', 'round');
    svgEl.appendChild(line);
    // Branches
    if (Math.random() > 0.3) {
      const allPts = pts.split(' ');
      const branchFrom = allPts[Math.min(2, allPts.length-1)].split(',');
      let bx = parseFloat(branchFrom[0]), by = parseFloat(branchFrom[1]);
      let bpts = `${bx},${by}`;
      const bAng = angle + (Math.random()-0.5)*3;
      for (let j = 0; j < 2 + Math.floor(Math.random()*3); j++) {
        bx += Math.cos(bAng + (Math.random()-0.5)*1.5) * (2+Math.random()*5);
        by += Math.sin(bAng + (Math.random()-0.5)*1.5) * (2+Math.random()*5);
        bpts += ` ${bx},${by}`;
      }
      const bl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      bl.setAttribute('points', bpts);
      bl.setAttribute('fill', 'none');
      bl.setAttribute('stroke', 'rgba(30,20,10,0.55)');
      bl.setAttribute('stroke-width', '0.8');
      bl.setAttribute('stroke-linecap', 'round');
      svgEl.appendChild(bl);
    }
  }
}

function startHatch() {
  if (isHatching) return;
  isHatching = true;
  document.getElementById('hatchBtn').disabled = true;
  const eggs = [0,1,2,3].map(i => document.getElementById(`egg${i}`));
  eggs.forEach(e => e.classList.add('wobbling'));

  setTimeout(() => {
    [0,1,2,3].forEach(i => { generateCracks(document.getElementById(`cracks${i}`)); document.getElementById(`cracks${i}`).style.opacity = '1'; });
  }, 1200);

  setTimeout(() => {
    [0,1,2,3].forEach(i => generateCracks(document.getElementById(`cracks${i}`)));
  }, 1800);

  setTimeout(() => {
    [0,1,2,3].forEach(i => {
      const egg = eggs[i];
      const rect = egg.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      egg.classList.remove('wobbling');
      const anim = ANIMALS[`${panels[i].size}-${panels[i].density}-${panels[i].limbs}`];
      spawnShellFragments(cx, cy, anim.m, anim.a);
      spawnParticles(cx, cy);
    });
    document.getElementById('dualContainer').style.display = 'none';
    document.getElementById('hatchBtn').style.display = 'none';
    document.getElementById('randomiseAll').style.display = 'none';
    [0,1,2,3].forEach(i => {
      const s = panels[i];
      const key = `${s.size}-${s.density}-${s.limbs}`;
      const animal = ANIMALS[key];
      const mc = animal.m, ac = animal.a;
      document.getElementById(`resultSvg${i}`).innerHTML = drawAnimal(animal.name, mc, ac);
      document.getElementById(`resultName${i}`).textContent = animal.name;

      // Stats
      const [hp, count] = SIZE_STATS[s.size];
      const [atkSpd, dmg] = DENSITY_STATS[s.density];
      const statsEl = document.getElementById(`resultStats${i}`);
      const spdPercent = ((MAX_SPD - atkSpd + 0.3) / MAX_SPD) * 100;
      statsEl.innerHTML = `
        <div class="stat-row">
          <div class="stat-label">Health</div>
          <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${hp/MAX_HP*100}%;background:linear-gradient(90deg,#e74c3c,#ff6b6b)"></div></div>
          <div class="stat-value">${hp}</div>
        </div>
        <div class="stat-row">
          <div class="stat-label">Damage</div>
          <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${dmg/MAX_DMG*100}%;background:linear-gradient(90deg,#e67e22,#f9ca24)"></div></div>
          <div class="stat-value">${dmg}</div>
        </div>
        <div class="stat-row">
          <div class="stat-label">Atk Speed</div>
          <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${spdPercent}%;background:linear-gradient(90deg,#3498db,#48cae4)"></div></div>
          <div class="stat-value">${atkSpd}s</div>
        </div>
        <div class="stat-count"><span>x${count}</span> ${animal.name}${count > 1 ? 's' : ''}</div>

      document.getElementById(`result${i}`).classList.add('visible');
    });
    document.getElementById('battleBtn').style.display = '';

  }, 2800);

function spawnShellFragments(cx, cy, mc, ac) {
  const container = document.getElementById('particles');
  const cols = [mc, mc, mc, ac];
  for (let i = 0; i < 12; i++) {
    const f = document.createElement('div');
    f.className = 'shell-fragment';
    const s = 12+Math.random()*22;
    const ang = Math.random()*Math.PI*2;
    const dist = 70+Math.random()*140;
    f.style.cssText = `width:${s}px;height:${s*0.7}px;left:${cx}px;top:${cy}px;background:${cols[Math.floor(Math.random()*cols.length)]}`;
    f.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    f.style.setProperty('--dy', (Math.sin(ang)*dist-40)+'px');
    f.style.setProperty('--rot', (Math.random()*720-360)+'deg');
    container.appendChild(f);
    setTimeout(() => f.remove(), 800);
  }
}

function spawnParticles(cx, cy) {
  const container = document.getElementById('particles');
  const colors = ['#ffd700','#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#ff9ff3'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = 4+Math.random()*8;
    const ang = Math.random()*Math.PI*2;
    const dist = 40+Math.random()*180;
    p.style.cssText = `width:${s}px;height:${s}px;left:${cx}px;top:${cy}px;background:${colors[Math.floor(Math.random()*colors.length)]}`;
    p.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy', (Math.sin(ang)*dist-60)+'px');
    container.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

// ===== BATTLE SYSTEM =====
let battleInterval = null;
let battleSpeed = 1;
let battleTeams = null;
let battleTime = 0;
let rngEnabled = true;

document.getElementById('multToggle').addEventListener('click', () => {
  rngEnabled = !rngEnabled;
  const btn = document.getElementById('multToggle');
  btn.textContent = `RNG: ${rngEnabled ? 'ON' : 'OFF'}`;
  btn.classList.toggle('on', rngEnabled);
});

document.getElementById('battleBtn').addEventListener('click', startBattle);
document.getElementById('rematchBtn').addEventListener('click', () => {
  if (battleInterval) { clearInterval(battleInterval); battleInterval = null; }
  startBattle();
});

// Speed buttons
document.getElementById('arenaControls').addEventListener('click', e => {
  const btn = e.target.closest('.speed-btn');
  if (!btn) return;
  battleSpeed = parseInt(btn.dataset.speed);
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});

function startBattle() {
  // Hide results & battle button
  [0,1,2,3].forEach(i => document.getElementById(`result${i}`).classList.remove('visible'));
  document.getElementById('battleBtn').style.display = 'none';
  document.getElementById('tryAgainBtn').style.display = 'none';
  document.getElementById('arenaWinner').style.display = 'none';
  battleTime = 0;

  const arena = document.getElementById('battleArena');
  arena.classList.add('visible');

  // Build teams: panels 0+1 = team 0, panels 2+3 = team 1
  const teamPanels = [[0,1],[2,3]];
  battleTeams = teamPanels.map((panelIdxs, teamIdx) => {
    const units = [];
    let unitCounter = 0;
    for (const pi of panelIdxs) {
    const s = panels[pi];
    const key = `${s.size}-${s.density}-${s.limbs}`;
    const animal = ANIMALS[key];
    const [hp, count] = SIZE_STATS[s.size];
    const [atkSpd, dmg] = DENSITY_STATS[s.density];
    const usedNames = {};
    for (let u = 0; u < count; u++) {
      let nick = generateName(animal.name, u);
      usedNames[nick] = (usedNames[nick] || 0) + 1;
      if (usedNames[nick] > 1) {
        const numerals = ['','II','III','IV','V','VI'];
        nick = `${nick} ${numerals[usedNames[nick] - 1]}`;
      }
      units.push({
        name: animal.name,
        nickname: nick,
        maxHp: hp,
        hp: hp,
        dmg: dmg,
        atkSpd: atkSpd,
        atkTimer: atkSpd * (0.5 + Math.random() * 0.5),
        alive: true,
        target: null,
        mc: animal.m,
        ac: animal.a,
        team: teamIdx,
        idx: unitCounter,
      });
      unitCounter++;
    }
    } // end panelIdxs loop
    return units;
  });

  const teams = battleTeams;

  // Build 2D stage
  const stage = document.getElementById('battleStage');
  // Clear old units but keep ground
  stage.querySelectorAll('.stage-unit').forEach(e => e.remove());

  const stageW = stage.offsetWidth || 800;
  const stageH = stage.offsetHeight || 400;

  // Position units: team 0 on left, team 1 on right
  [0,1].forEach(t => {
    const count = teams[t].length;
    teams[t].forEach((unit, u) => {
      const homeX = t === 0 ? 40 + Math.random() * 40 : stageW - 90 - Math.random() * 40;
      const spacing = Math.min(55, (stageH - 100) / count);
      const startY = (stageH - count * spacing) / 2 + 20;
      const homeY = startY + u * spacing;
      unit.x = homeX;
      unit.y = homeY;
      unit.homeX = homeX;
      unit.homeY = homeY;
      unit.lungeTimer = 0;

      const el = document.createElement('div');
      el.className = 'stage-unit';
      el.id = `unit-${t}-${u}`;
      el.style.left = unit.x + 'px';
      el.style.top = unit.y + 'px';
      el.innerHTML = `
        <div class="stage-unit-svg ${t === 1 ? 'flipped' : ''}">${drawAnimal(unit.name, unit.mc, unit.ac)}</div>
        <div class="stage-hp"><div class="stage-hp-fill" id="hp-${t}-${u}" style="width:100%"></div></div>
        <div class="stage-name">${unit.nickname}</div>
      `;
      stage.appendChild(el);
    });
  });

  function getAliveEnemies(teamIdx) {
    return teams[1 - teamIdx].filter(u => u.alive);
  }

  function assignTarget(unit) {
    const enemies = getAliveEnemies(unit.team);
    if (enemies.length === 0) { unit.target = null; return; }
    unit.target = enemies[0];
  }

  const TICK = 1/30;
  let animFrame = null;

  // Animation loop — moves units toward targets
  function animateUnits() {
    [0,1].forEach(t => {
      teams[t].forEach(unit => {
        if (!unit.alive) return;
        const el = document.getElementById(`unit-${unit.team}-${unit.idx}`);
        if (!el) return;

        let goalX = unit.homeX, goalY = unit.homeY;

        if (unit.target && unit.target.alive) {
          // Move toward target, stop 60px away
          const dx = unit.target.x - unit.x;
          const dy = unit.target.y - unit.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist > 65) {
            goalX = unit.x + dx * 0.03;
            goalY = unit.y + dy * 0.03;
          } else {
            goalX = unit.x;
            goalY = unit.y;
          }
        }

        // Lunge effect
        if (unit.lungeTimer > 0) {
          unit.lungeTimer -= TICK * battleSpeed;
          if (unit.target) {
            const dir = unit.team === 0 ? 1 : -1;
            goalX = unit.x + dir * 12 * Math.max(0, unit.lungeTimer / 0.15);
          }
        }

        unit.x += (goalX - unit.x) * 0.15;
        unit.y += (goalY - unit.y) * 0.15;
        el.style.left = unit.x + 'px';
        el.style.top = unit.y + 'px';
      });
    });
    animFrame = requestAnimationFrame(animateUnits);
  }
  animateUnits();

  battleInterval = setInterval(() => {
    const dt = TICK * battleSpeed;
    battleTime += dt;

    [0,1].forEach(t => {
      teams[t].forEach(unit => {
        if (!unit.alive) return;

        if (!unit.target || !unit.target.alive) {
          assignTarget(unit);
        }
        if (!unit.target) return;

        unit.atkTimer -= dt;
        if (unit.atkTimer <= 0) {
          unit.atkTimer = unit.atkSpd;

          // Deal damage with variance — UNCHANGED
          const target = unit.target;
          let mult = 1, rollType = 'normal';
          if (rngEnabled) {
            const roll = Math.random() * 100;
            if (roll < 1) { mult = 0; rollType = 'miss'; }
            else if (roll < 2) { mult = 2; rollType = 'crit'; }
            else if (roll < 6) { mult = 0.65; rollType = 'weak'; }
            else if (roll < 10) { mult = 1.35; rollType = 'strong'; }
            else if (roll < 20) { mult = 0.85; rollType = 'normal'; }
            else if (roll < 30) { mult = 1.15; rollType = 'normal'; }
          }
          const finalDmg = Math.round(unit.dmg * mult);
          target.hp -= finalDmg;

          // Lunge attacker
          unit.lungeTimer = 0.15;

          // Damage popup on target position
          if (rollType !== 'normal' || finalDmg > 0) {
            const popup = document.createElement('div');
            popup.className = `stage-dmg-popup ${rollType}-pop`;
            if (rollType === 'crit') popup.textContent = `x2! ${finalDmg}`;
            else if (rollType === 'miss') popup.textContent = 'MISS';
            else if (rollType === 'strong') popup.textContent = `+35%`;
            else if (rollType === 'weak') popup.textContent = `-35%`;
            else popup.textContent = `-${finalDmg}`;
            popup.style.left = (target.x + 10 + Math.random() * 20) + 'px';
            popup.style.top = (target.y - 5) + 'px';
            stage.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
          }

          if (target.hp <= 0) {
            target.hp = 0;
            target.alive = false;
            const tgtEl = document.getElementById(`unit-${target.team}-${target.idx}`);
            if (tgtEl) tgtEl.classList.add('dead');
            unit.target = null;
          }

          // Update HP bar
          const hpFill = document.getElementById(`hp-${target.team}-${target.idx}`);
          if (hpFill) {
            const pct = Math.max(0, target.hp / target.maxHp * 100);
            hpFill.style.width = pct + '%';
            if (pct > 50) hpFill.style.background = '#2ecc71';
            else if (pct > 25) hpFill.style.background = '#f39c12';
            else hpFill.style.background = '#e74c3c';
          }
        }
      });
    });

    // Check win condition
    const team0alive = teams[0].filter(u => u.alive).length;
    const team1alive = teams[1].filter(u => u.alive).length;

    if (team0alive === 0 || team1alive === 0) {
      clearInterval(battleInterval);
      battleInterval = null;
      if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
      const winTeam = team0alive > 0 ? 1 : 2;
      const winIdx = team0alive > 0 ? 0 : 1;
      const remaining = Math.max(team0alive, team1alive);
      const winNames = [...new Set(teams[winIdx].filter(u => u.alive).map(u => u.name))].join(' & ');
      const winnerEl = document.getElementById('arenaWinner');
      winnerEl.textContent = `Team ${winTeam} wins! ${winNames} (${remaining} left) victorious!`;
      winnerEl.style.display = '';
      document.getElementById('tryAgainBtn').style.display = '';
    }
  }, TICK * 1000);
}

  });
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !isHatching) { e.preventDefault(); startHatch(); }
  if (e.code === 'Escape') document.getElementById('matchupOverlay').classList.remove('visible');
});

// ===== MATCHUP CHART =====
document.getElementById('matchupToggle').addEventListener('click', () => {
  const overlay = document.getElementById('matchupOverlay');
  overlay.classList.add('visible');
  if (!document.getElementById('matchupTable')) buildMatchupTable();
});
document.getElementById('matchupClose').addEventListener('click', () => {
  document.getElementById('matchupOverlay').classList.remove('visible');
});
document.getElementById('matchupOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('visible');
});

function simBattle(sA, dA, sB, dB) {
  const [hpA, countA] = SIZE_STATS[sA];
  const [spdA, dmgA] = DENSITY_STATS[dA];
  const [hpB, countB] = SIZE_STATS[sB];
  const [spdB, dmgB] = DENSITY_STATS[dB];

  const teamA = []; for (let i = 0; i < countA; i++) teamA.push({ hp: hpA, timer: spdA });
  const teamB = []; for (let i = 0; i < countB; i++) teamB.push({ hp: hpB, timer: spdB });

  const dt = 0.05;
  let time = 0;
  while (time < 50000) {
    time += dt;
    const aliveA = teamA.filter(u => u.hp > 0);
    const aliveB = teamB.filter(u => u.hp > 0);
    if (!aliveA.length || !aliveB.length) break;

    for (const u of aliveA) {
      u.timer -= dt;
      if (u.timer <= 0.025) {
        u.timer += spdA;
        const t = teamB.find(x => x.hp > 0);
        if (t) t.hp -= dmgA;
      }
    }
    for (const u of aliveB) {
      u.timer -= dt;
      if (u.timer <= 0.025) {
        u.timer += spdB;
        const t = teamA.find(x => x.hp > 0);
        if (t) t.hp -= dmgB;
      }
    }
  }
  const aLeft = teamA.filter(u => u.hp > 0).length;
  const bLeft = teamB.filter(u => u.hp > 0).length;
  return { aLeft, bLeft, time: time.toFixed(1) };
}

function buildMatchupTable() {
  const profiles = [];
  for (let s = 0; s < 3; s++) {
    for (let d = 0; d < 3; d++) {
      const [hp, count] = SIZE_STATS[s];
      const [spd, dmg] = DENSITY_STATS[d];
      profiles.push({ s, d, label: `${sizeNames[s]}/${densityNames[d]}`, detail: `${count}x ${hp}hp ${dmg}dmg ${spd}s` });
    }
  }

  let html = '<table class="matchup-table" id="matchupTable"><thead><tr><th class="corner"></th>';
  for (const p of profiles) html += `<th class="col-header" title="${p.detail}">${p.label}</th>`;
  html += '</tr></thead><tbody>';

  for (let i = 0; i < profiles.length; i++) {
    html += `<tr><td class="row-header" title="${profiles[i].detail}">${profiles[i].label}</td>`;
    for (let j = 0; j < profiles.length; j++) {
      if (i === j) {
        html += '<td class="mirror">Draw</td>';
      } else {
        const r = simBattle(profiles[i].s, profiles[i].d, profiles[j].s, profiles[j].d);
        if (r.aLeft > 0) {
          html += `<td class="win1" title="${profiles[i].label} beats ${profiles[j].label}">${r.aLeft} left / ${r.time}s</td>`;
        } else if (r.bLeft > 0) {
          html += `<td class="win2" title="${profiles[j].label} beats ${profiles[i].label}">${r.bLeft} left / ${r.time}s</td>`;
        } else {
          html += `<td class="draw">Draw</td>`;
        }
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('matchupTableContainer').innerHTML = html;
}
</script>
